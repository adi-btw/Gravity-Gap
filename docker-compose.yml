# One-command local stack (plan R13 fallback): `docker compose up --build`
#   web  http://localhost:3000   api  http://localhost:8000/docs
# Optional secrets come from your shell or a git-ignored .env file next to this file:
#   LEDGER_TEAM_TOKEN (enables POST /ledger), ANTHROPIC_API_KEY (live Claude answers in /ask).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      LEDGER_TEAM_TOKEN: "${LEDGER_TEAM_TOKEN:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        # The browser on your machine calls the API through the published port.
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
